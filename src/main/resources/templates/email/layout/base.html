<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${emailTitle}">Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f4f4f4;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            text-align: center;
        }

        .email-header img {
            max-width: 150px;
            height: auto;
        }

        .email-header h1 {
            color: #ffffff;
            font-size: 24px;
            margin-top: 10px;
        }

        .email-body {
            padding: 40px 30px;
        }

        .email-body h2 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .email-body p {
            color: #666666;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 16px;
            margin: 20px 0;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .warning-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .danger-box {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .code-box {
            background-color: #f8f9fa;
            border: 2px dashed #667eea;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            border-radius: 8px;
        }

        .code-box .otp-code {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }

        .email-footer {
            background-color: #f8f9fa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .email-footer p {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .email-footer a {
            color: #667eea;
            text-decoration: none;
        }

        .email-footer a:hover {
            text-decoration: underline;
        }

        .social-links {
            margin: 20px 0;
        }

        .social-links a {
            display: inline-block;
            margin: 0 10px;
            color: #6c757d;
            text-decoration: none;
        }

        .divider {
            height: 1px;
            background-color: #e9ecef;
            margin: 30px 0;
        }

        @media only screen and (max-width: 600px) {
            .email-body {
                padding: 30px 20px;
            }

            .email-body h2 {
                font-size: 20px;
            }

            .button {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <!-- Header -->
    <div class="email-header">
        <img th:src="${logoUrl}" src="https://via.placeholder.com/150x50?text=YourApp" alt="Logo" />
        <h1 th:text="${companyName}">OneClick</h1>
    </div>

    <!-- Body Content (will be replaced by child templates) -->
    <div class="email-body" th:insert="~{::body-content}">
        <!-- Child template content goes here -->
    </div>

    <!-- Footer -->
    <div class="email-footer">
        <p>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> <span th:text="${companyName}">OneClick</span>. All rights reserved.</p>

        <div class="social-links">
            <a th:href="${facebookUrl}" href="#">Facebook</a>
            <a th:href="${twitterUrl}" href="#">Twitter</a>
            <a th:href="${linkedinUrl}" href="#">LinkedIn</a>
        </div>

        <p>
            <a th:href="${helpUrl}" href="#">Help Center</a> |
            <a th:href="${privacyUrl}" href="#">Privacy Policy</a> |
            <a th:href="${termsUrl}" href="#">Terms of Service</a>
        </p>

        <p style="margin-top: 20px; font-size: 12px; color: #adb5bd;">
            This email was sent to <strong th:text="${recipientEmail}">user@example.com</strong>
        </p>
    </div>
</div>
</body>
</html>
