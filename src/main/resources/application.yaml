
# ============================================
# SERVER CONFIGURATION
# ============================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  tomcat:
    max-threads: ${SERVER_TOMCAT_MAX_THREADS:200}

# ============================================
# SPRING CONFIGURATION
# ============================================
spring:
  application:
    name: ${APP_NAME:authService-be}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    fail-fast: ${SPRING_CONFIG_FAIL_FAST:false}

  # ============================================
  # DATASOURCE (PostgreSQL)
  # ============================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}

  # ============================================
  # JPA & HIBERNATE
  # ============================================
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
        jdbc:
          batch_size: ${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE:20}
        order_inserts: ${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS:true}
        order_updates: ${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES:true}

  # ============================================
  # FLYWAY MIGRATION (Added spring. prefix)
  # ============================================
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
    clean-disabled: ${SPRING_FLYWAY_CLEAN_DISABLED:true}

  # ============================================
  # REDIS (Added Redis config)
  # ============================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:0}

  # ============================================
  # CACHE (Changed from NONE to redis)
  # ============================================
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: ${SPRING_CACHE_REDIS_TIME_TO_LIVE:3600000}  # 1 hour

  # ============================================
  # FILE UPLOAD
  # ============================================
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

  # ============================================
  # DEVTOOLS (Hot Reload)
  # ============================================
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:true}
      additional-paths: ${SPRING_DEVTOOLS_RESTART_ADDITIONAL_PATHS:src/main}
      poll-interval: ${SPRING_DEVTOOLS_RESTART_POLL_INTERVAL:1s}
      quiet-period: ${SPRING_DEVTOOLS_RESTART_QUIET_PERIOD:400ms}
    livereload:
      enabled: ${SPRING_DEVTOOLS_LIVERELOAD_ENABLED:true}
      port: ${SPRING_DEVTOOLS_LIVERELOAD_PORT:35729}

# ============================================
# ACTUATOR (Corrected metrics path)
# ============================================
management:
  endpoints:
    enabled-by-default: ${MANAGEMENT_ENDPOINTS_ENABLED_BY_DEFAULT:true}
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      base-path: ${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/actuator}

  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
      group:
        readiness:
          include: ${MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE:db,redis}
        liveness:
          include: ${MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE:ping}

  metrics:
    export:
      simple:
        enabled: ${MANAGEMENT_METRICS_EXPORT_SIMPLE_ENABLED:true}

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    com.oneClick: ${LOGGING_LEVEL_COM_ONECLICK:DEBUG}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

# ============================================
# CUSTOM APP PROPERTIES
# ============================================
app:
  version: ${APP_VERSION:@project.version@}
  environment: ${APP_ENVIRONMENT:development}
  features:
    cache-enabled: ${APP_FEATURES_CACHE_ENABLED:true}
    metrics-enabled: ${APP_FEATURES_METRICS_ENABLED:true}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000  # 7 days
  issuer: authService-be
